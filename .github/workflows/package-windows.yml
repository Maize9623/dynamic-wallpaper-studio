name: Package Windows portable app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Windows x64 package
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      PACKAGE_NAME: DynamicWallpaperStudio-Windows-x64-1.0.5-OnlinePortable
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build self-contained portable package
        shell: pwsh
        run: |
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE ("release\" + $env:PACKAGE_NAME)
          & "windows/scripts/build.ps1" `
            -Configuration Release `
            -RuntimeIdentifier win-x64 `
            -OutputDirectory $outputDirectory `
            -CreateZip

      - name: Verify package contents
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE "release"
          $publishDirectory = Join-Path $releaseDirectory $env:PACKAGE_NAME
          $zipPath = Join-Path $releaseDirectory ($env:PACKAGE_NAME + ".zip")
          $checksumPath = $zipPath + ".sha256"

          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
            throw "Release ZIP was not created: $zipPath"
          }
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
            throw "SHA-256 file was not created: $checksumPath"
          }

          $executablePath = Join-Path $publishDirectory "DynamicWallpaperStudio.exe"
          $depsPath = Join-Path $publishDirectory "DynamicWallpaperStudio.deps.json"
          if ((Get-Item -LiteralPath $executablePath).VersionInfo.FileVersion -ne "1.0.5.0") {
            throw "DynamicWallpaperStudio.exe does not have FileVersion 1.0.5.0."
          }
          $deps = Get-Content -LiteralPath $depsPath -Raw
          if ($deps -notmatch 'Microsoft\.NETCore\.App\.Runtime\.win-x64/10\.0\.12' -or
              $deps -notmatch 'Microsoft\.WindowsDesktop\.App\.Runtime\.win-x64/10\.0\.12') {
            throw "The self-contained package was not built with the pinned .NET 10.0.12 runtime packs."
          }

          $forbiddenNames = @("ffmpeg.exe", "ffprobe.exe", "mpv.exe", "vulkan-1.dll")
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $expectedPrefix = $env:PACKAGE_NAME + "/"
            $unexpectedRoots = @($archive.Entries | Where-Object {
              -not $_.FullName.StartsWith($expectedPrefix, [System.StringComparison]::Ordinal)
            })
            if ($unexpectedRoots.Count -gt 0) {
              throw "Release ZIP does not use the expected root folder '$env:PACKAGE_NAME'."
            }

            $expectedExecutable = $expectedPrefix + "DynamicWallpaperStudio.exe"
            if (-not ($archive.Entries.FullName -contains $expectedExecutable)) {
              throw "Release ZIP is missing $expectedExecutable."
            }

            $entryNames = @($archive.Entries | ForEach-Object {
              [System.IO.Path]::GetFileName($_.FullName)
            })
            $bundledTools = @($entryNames | Where-Object { $forbiddenNames -contains $_ })
            if ($bundledTools.Count -gt 0) {
              throw "Release ZIP unexpectedly contains third-party tools: $($bundledTools -join ', ')"
            }

            $forbiddenExtensions = @(".pdb", ".mp4", ".mov", ".m4v", ".avi", ".dwallpaper")
            $unexpectedFiles = @($archive.Entries | Where-Object {
              $forbiddenExtensions -contains [System.IO.Path]::GetExtension($_.Name).ToLowerInvariant()
            })
            if ($unexpectedFiles.Count -gt 0) {
              throw "Release ZIP unexpectedly contains debug symbols or media: $($unexpectedFiles.FullName -join ', ')"
            }

            $requiredNotices = @(
              "LICENSE.txt",
              "NOTICE.txt",
              "PRIVACY.md",
              "THIRD_PARTY_NOTICES.md",
              "LICENSES/dotnet-LICENSE.txt",
              "LICENSES/dotnet-ThirdPartyNotices.txt",
              "LICENSES/dotnet-wpf-10.0.12-LICENSE.txt",
              "LICENSES/dotnet-wpf-10.0.12-ThirdPartyNotices.txt",
              "LICENSES/dotnet-10.0.12-license-information-windows.md"
            )
            foreach ($notice in $requiredNotices) {
              if (-not ($archive.Entries.FullName -contains ($expectedPrefix + $notice))) {
                throw "Release ZIP is missing required notice: $notice"
              }
            }
          }
          finally {
            $archive.Dispose()
          }

          $expectedHash = ((Get-Content -LiteralPath $checksumPath -Raw).Trim() -split "\s+")[0]
          $actualHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expectedHash -ne $actualHash) {
            throw "SHA-256 verification failed. Expected $expectedHash but found $actualHash."
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            release/${{ env.PACKAGE_NAME }}.zip
            release/${{ env.PACKAGE_NAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
