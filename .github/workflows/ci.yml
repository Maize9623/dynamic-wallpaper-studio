name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS build
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build macOS application
        run: bash macos/scripts/build.sh

  windows:
    name: Windows build
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Windows project
        run: dotnet restore "windows/DynamicWallpaperStudio.Windows.csproj"

      - name: Build Windows project
        run: dotnet build "windows/DynamicWallpaperStudio.Windows.csproj" --configuration Release --no-restore
